apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sm-config-kms
  namespace: sm-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sm-config-kms.sm-platform.example.com
      secretName: sm-config-kms-tls
  rules:
    - host: sm-config-kms.sm-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sm-config-kms
                port:
                  number: 8300
